# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # CRITICAL ERRORS - These will show as errors in the IDE
    missing_required_param: error
    missing_return: error
    undefined_identifier: error
    uri_does_not_exist: error
    invalid_assignment: error
    argument_type_not_assignable: error
    
    # STYLE RULES - Reduce noise by making these warnings instead of info
    prefer_single_quotes: ignore
    prefer_const_constructors: ignore
    prefer_const_literals_to_create_immutables: ignore
    
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  # Focus on error prevention, not just style
  rules:
    # Error prevention (important for catching bugs)
    avoid_empty_else: true
    avoid_returning_null_for_future: true
    avoid_types_as_parameter_names: true
    no_duplicate_case_values: true
    valid_regexps: true
    
    # Code quality (less noisy)
    curly_braces_in_flow_control_structures: true
    use_key_in_widget_constructors: false  # Too noisy for large projects

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
