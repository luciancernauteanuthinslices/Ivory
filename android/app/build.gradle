plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.thinslices.solarisdemo"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 26
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner = "pl.leancode.patrol.PatrolJUnitRunner"
        testInstrumentationRunnerArguments["clearPackageData"] = "true"

    }

   signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
   }
   
   buildTypes {
       release {
           signingConfig signingConfigs.release
           minifyEnabled true
           proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
       }
   }
    namespace 'com.thinslices.solarisdemo'
    testOptions {
        execution = "ANDROIDX_TEST_ORCHESTRATOR"
        // Configure report output directory to match Patrol CLI's expected path
        reportDir = "${buildDir}/reports/androidTests/connected"
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation('io.seon.androidsdk:androidsdk:5.0.3') {
        transitive = true
    }
    implementation("com.nimbusds:nimbus-jose-jwt:9.23")
    androidTestUtil("androidx.test:orchestrator:1.5.1")
}

// Task to ensure test reports are accessible at the expected path
// Copies reports from variant-specific directories to the base connected directory
tasks.whenTaskAdded { task ->
    if (task.name.startsWith('connected') && task.name.endsWith('AndroidTest')) {
        task.doLast {
            def reportBaseDir = file("${buildDir}/reports/androidTests/connected")
            def debugReportDir = file("${buildDir}/reports/androidTests/connected/debug")
            
            // If debug report exists but base report doesn't, copy it
            if (debugReportDir.exists() && debugReportDir.isDirectory()) {
                def debugIndex = new File(debugReportDir, 'index.html')
                def baseIndex = new File(reportBaseDir, 'index.html')
                
                if (debugIndex.exists() && !baseIndex.exists()) {
                    println "📊 Copying test report to expected location..."
                    copy {
                        from debugReportDir
                        into reportBaseDir
                        include '**/*'
                    }
                    println "✅ Report available at: ${reportBaseDir}/index.html"
                }
            }
        }
    }
}
