openapi: '3.0.1'
info:
  title: 'uat-SolarisDemoBackend-Api'
  version: '2023-08-09 08:02:56UTC'
servers:
  - url: 'https://{stage}.execute-api.eu-west-1.amazonaws.com/{basePath}'
    variables:
      stage:
        description: 'SST Stage'
        default: 'jsxhc7emf3'
      basePath:
        description: 'UAT'
        default: ''

tags:
  - name: 'Notifications'
paths:
  /account:
    get:
      summary: Gets the account details for the authenticated user (from cognito)
      responses:
        '200':
          description: A JSON containing account's information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
      security:
        - jwt: []
  /account/cards:
    get:
      summary: Gets card information
      responses:
        '200':
          description: An array containing the cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cards'
      security:
        - jwt: []
    post:
      summary: Create a new card
      requestBody:
        description: Card's body
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequestBody'
      responses:
        '200':
          description: Card created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          description: 'Default response for POST /account/cards'
      security:
        - jwt: []
  /account/cards/{card_id}:
    get:
      description: Gets card information
      responses:
        '200':
          description: Card information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          description: 'Default response for GET /account/cards/{card_id}'
      security:
        - jwt: []
    post:
      description: Activates the card
      responses:
        '200':
          description: Card information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          description: 'Default response for POST /account/cards/{card_id}'
      security:
        - jwt: []
    parameters:
      - name: 'card_id'
        in: 'path'
        description: 'Generated path parameter for card_id'
        required: true
        schema:
          type: 'string'
  /account/cards/{card_id}/pin_keys/latest:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        default:
          description: 'Default response for GET /account/cards/{card_id}/pin_keys/latest'
      security:
        - jwt: []
    parameters:
      - name: 'card_id'
        in: 'path'
        description: 'Generated path parameter for card_id'
        required: true
        schema:
          type: 'string'
  /account/summary:
    get:
      description: Gets person's account data
      responses:
        '200':
          description: Data is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonAccount'
        default:
          description: 'Default response for GET /account/summary'
      security:
        - jwt: []
  /person:
    get:
      description: Get person information
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        default:
          description: 'Default response for GET /person'
      security:
        - jwt: []
    post:
      summary: Creates person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        default:
          description: 'Default response for POST /person'
  /status:
    get:
      responses:
        '200':
          description: Up and running

  /transactions:
    get:
      responses:
        '200':
          description: 'Transactions list'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transactions'
      security:
        - jwt: []
    post:
      description: Create a new transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTransactionResponseBody'
        default:
          description: 'Default response for POST /transactions'
      security:
        - jwt: []
  /transactions/categories:
    get:
      responses:
        '200':
          description: 'Get transaction categories'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTransactionCategories'
  /account/cards/{card_id}/block:
    post:
      responses:
        '200':
          description: Card blocked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        default:
          description: 'Default response for POST /account/cards/{card_id}/block'
      security:
        - jwt: []
    parameters:
      - name: 'card_id'
        in: 'path'
        description: 'Generated path parameter for card_id'
        required: true
        schema:
          type: 'string'
  /account/cards/{card_id}/change_card_pin:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCardPinRequestBody'
      responses:
        '200':
          description: OK
        default:
          description: 'Default response for POST /account/cards/{card_id}/change_card_pin'
      security:
        - jwt: []
    parameters:
      - name: 'card_id'
        in: 'path'
        description: 'Generated path parameter for card_id'
        required: true
        schema:
          type: 'string'
  /account/cards/{card_id}/unblock:
    post:
      responses:
        '200':
          description: Card unblocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        default:
          description: 'Default response for POST /account/cards/{card_id}/unblock'
      security:
        - jwt: []
    parameters:
      - name: 'card_id'
        in: 'path'
        description: 'Generated path parameter for card_id'
        required: true
        schema:
          type: 'string'
  /accounts:
    post:
      responses:
        '200':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccountResponse'
        default:
          description: 'Default response for POST /accounts'
      security:
        - jwt: []
  /change_requests/{change_request_id}/confirm:
    post:
      requestBody:
        description: Body of the request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmChangeRequestBody'
      responses:
        default:
          description: 'Default response for POST /change_requests/{change_request_id}/confirm'
      security:
        - jwt: []
    parameters:
      - name: 'change_request_id'
        in: 'path'
        description: 'Generated path parameter for change_request_id'
        required: true
        schema:
          type: 'string'
  /person/device:
    post:
      description: Saves mobile number
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveMobileNumberRequestBody'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessObject'
        default:
          description: 'Default response for POST /person/device'
      security:
        - jwt: []
  /person/device/activity:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceActivityResponseBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessObject'
        default:
          description: 'Default response for POST /person/device/activity'
      security:
        - jwt: []
  /person/device/binding:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBindingRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceBindingResponse'
        default:
          description: 'Default response for POST /person/device/binding'
      security:
        - jwt: []
  /person/device/consent:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceConsentRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceConsent'
        default:
          description: 'Default response for POST /person/device/consent'
      security:
        - jwt: []
  /person/device/verify_signature/{device_id}:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifySignatureRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessObject'
        default:
          description: 'Default response for POST /person/device/verify_signature/{device_id}'
      security:
        - jwt: []
    parameters:
      - name: 'device_id'
        in: 'path'
        description: 'Generated path parameter for device_id'
        required: true
        schema:
          type: 'string'
  /person/kyc:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndentifyPersonRequestBody'
      responses:
        default:
          description: 'Default response for POST /person/kyc'
      security:
        - jwt: []
  /person/tax_identification:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxIdentificationRequestBody'
      responses:
        default:
          description: 'Default response for POST /person/tax_identification'
      security:
        - jwt: []
  /notifications:
    post:
      tags:
        - 'Notifications'
      security:
        - jwt: []
      description: Send a push notification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReponse'
  /notifications/scheduled:
    post:
      tags:
        - 'Notifications'
      security:
        - jwt: []
      description: Schedule a push notification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledNotificationRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledNotification'
    get:
      tags:
        - 'Notifications'
      security:
        - jwt: []
      description: Get all scheduled notifications
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduledNotification'
  /notifications/scheduled/{id}:
    delete:
      tags:
        - 'Notifications'
      security:
        - jwt: []
      description: Delete a scheduled notification
      parameters:
        - name: 'id'
          in: 'path'
          required: true
          schema:
            type: 'string'
      responses:
        '204':
          description: No Content

components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          example: account-id
        bic:
          type: string
          example: bic
        iban:
          type: string
          example: IBAN
        type:
          type: string
          example: type
        income:
          $ref: '#/components/schemas/CurrencyValue'
        status:
          type: string
          example: active
        balance:
          $ref: '#/components/schemas/CurrencyValue'
        spending:
          $ref: '#/components/schemas/CurrencyValue'
        opened_at:
          type: string
          example: 2020-01-02
        closed_at:
          type: string
          example: 2020-01-02
        person_id:
          type: string
          example: something ending in per
        overdraft:
          $ref: '#/components/schemas/SolarisOverdraft'
        partner_id:
          type: string
          example: 2424
        business_id:
          type: string
          example: 44444
        account_limit:
          $ref: '#/components/schemas/CurrencyValue'
        locking_status:
          type: string
          example: not locked
        locking_reasons:
          type: array
          items:
            type: string
            example: something
        available_balance:
          $ref: '#/components/schemas/CurrencyValue'
    CurrencyValue:
      type: object
      properties:
        value:
          type: integer
          example: 1000
        currency:
          type: string
          example: euro
        unit:
          $ref: '#/components/schemas/TransactionUnitEnum'
    TransactionUnitEnum:
      type: string
      enum: ['value', 'cents']
    SolarisOverdraft:
      type: object
      properties:
        rate:
          type: integer
          example: 123
        limit:
          type: integer
          example: 3542
    Cards:
      type: array
      items:
        oneOf:
          - $ref: '#/components/schemas/Card'
    Card:
      type: object
      properties:
        id:
          type: string
          example: card-id
        account_id:
          type: string
          example: account-id
        type:
          $ref: '#/components/schemas/CardTypeEnum'
        status:
          $ref: '#/components/schemas/CardStatusEnum'
        representation:
          $ref: '#/components/schemas/CardRepresentation'
    CardTypeEnum:
      type: string
      enum:
        [
          'VISA_BUSINESS_DEBIT',
          'VISA_BUSINESS_DEBIT_2',
          'MASTERCARD_BUSINESS_DEBIT',
          'VIRTUAL_VISA_BUSINESS_DEBIT',
          'VIRTUAL_VISA_FREELANCE_DEBIT',
          'VIRTUAL_MASTERCARD_BUSINESS_DEBIT',
          'VIRTUAL_VISA_CREDIT',
        ]
    CardStatusEnum:
      type: string
      enum:
        [
          'ACTIVE',
          'CLOSED',
          'BLOCKED',
          'INACTIVE',
          'PROCESSING',
          'CLOSED_BY_SOLARIS',
          'BLOCKED_BY_SOLARIS',
          'ACTIVATION_BLOCKED_BY_SOLARIS',
        ]
    CardRepresentation:
      type: object
      properties:
        line_1:
          type: string
          example: John
        line_2:
          type: string
          example: Snow
        masked_pan:
          type: string
          example: 1234567891234xxxx
        formatted_expiration_date:
          type: string
          example: 12/29
    CreateCardRequestBody:
      type: object
      properties:
        line_1:
          type: string
          example: John
        line_2:
          type: string
          example: Snow
        type:
          type: string
          example: Card
        business_id:
          type: string
          example: idd
        reference:
          type: string
          example: reference
    PersonAccount:
      type: object
      properties:
        id:
          type: string
          example: account id
        bic:
          type: string
          example: bic
        iban:
          type: string
          example: IBAN
        balance:
          $ref: '#/components/schemas/CurrencyValue'
        available_balance:
          $ref: '#/components/schemas/CurrencyValue'
        income:
          type: integer
          example: 1324
        spending:
          type: integer
          example: 1235
    Person:
      type: object
      properties:
        id:
          type: string
          example: something-per
        title:
          $ref: '#/components/schemas/PersonTitle'
        email:
          type: string
          example: email@email.com
        branch:
          $ref: '#/components/schemas/PersonBranch'
        birth_date:
          type: string
          example: 2020-01-02
        industry:
          $ref: '#/components/schemas/PersonIndustry'
        last_name:
          type: string
          example: John
        job_title:
          type: string
          example: Medic
        nace_code:
          $ref: '#/components/schemas/PersonNaceCode'
        salutation:
          $ref: '#/components/schemas/PersonSalutation'
        first_name:
          type: string
          example: Snow
        birth_name:
          type: string
          example: Snow
        birth_city:
          type: string
          example: Berlin
        vat_number:
          type: string
          example: 112345
        nationality:
          $ref: '#/components/schemas/Country'
        industry_key:
          $ref: '#/components/schemas/PersonIndustryKey'
        work_country:
          $ref: '#/components/schemas/Country'
