          type: string
          example: 123535343
        birth_country:
          $ref: '#/components/schemas/Country'
        business_city:
          $ref: '#/components/schemas/Country'
        work_province:
          $ref: '#/components/schemas/Country'
        aml_confirmed_on:
          type: string
          example: 2020-01-22
        address:
          $ref: '#/components/schemas/Address'
        fatca_relevant:
          type: boolean
          example: false
        business_purpose:
          type: string
          example: Purpose
        business_country:
          $ref: '#/components/schemas/Country'
        aml_follow_up_date:
          type: string
          example: 2022-01-01
        employment_status:
          $ref: '#/components/schemas/PersonEmploymentStatus'
        screening_progress:
          type: string
          example: progress
        data_terms_signed_at:
          type: string
          example: 2022-01-01
        annual_income_range:
          $ref: '#/components/schemas/PersonAnnualIncomeRange'
        registration_number:
          type: string
          example: 32424
        fatca_crs_confirmed_at:
          type: string
          example: 2020-01-01
        website_social_media:
          type: string
          example: www.google.com
        business_postal_code:
          type: string
          example: 342424
        business_trading_name:
          type: string
          example: BTN
        self_declared_as_pep:
          type: boolean
          example: false
        flagged_by_compliance:
          type: boolean
          example: false
        legitimation_valid_until:
          type: string
          example: 2020-12-02
        contact_address:
          $ref: '#/components/schemas/Address'
        business_address_line_1:
          type: string
          example: Line 1
        business_address_line_2:
