name: Patrol Android CI - Firebase Test Lab

# Uses Firebase Test Lab for fast, reliable Android testing in the cloud.
# Secrets required:
#   - PATROL_EMAIL, PATROL_PASSWORD (test credentials)
#   - FIREBASE_SERVICE_ACCOUNT (Base64-encoded service account JSON)
#   - FIREBASE_PROJECT_ID (your Firebase project ID)
# Configure these in: Settings → Secrets and variables → Actions → Repository secrets
#
# See FIREBASE_TEST_LAB_SETUP.md for instructions on setting up Firebase Test Lab.

on:
  push:
    branches:
      - main
      - test_playground
      - SOL-*
  pull_request:
    branches:
      - main
      - test_playground
      - SOL-*
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Test filter (e.g., cardCanBeFrozenOrUnfreeze_test.dart or leave empty for all)'
        required: false
        default: ''
      max_retries:
        description: 'Number of retry attempts'
        required: false
        default: '1'

jobs:
  patrol-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Using latest stable to get Dart SDK 3.8.0+ required by patrol_finders

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      # Optional: Gradle cache to speed up build times
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Create main .env file (required for app config)
      - name: Create .env file
        run: |
          cat > .env << EOF
          COGNITO_USER_POOL_ID=${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          GEONAMES_USERNAME=${{ secrets.GEONAMES_USERNAME }}
          EOF
          echo "✅ Created .env with app configuration"

      - name: Build APKs with Patrol
        run: |
          flutter doctor -v
          echo "🔨 Building test APKs for Firebase Test Lab"
          
          # Build for each test file or all tests
          if [ -n "${{ github.event.inputs.test_filter }}" ]; then
            TEST_PATH="integration_test/${{ github.event.inputs.test_filter }}"
            echo "📝 Building for specific test: $TEST_PATH"
            patrol build android \
              --target "$TEST_PATH" \
              --dart-define=PATROL_EMAIL="${{ secrets.PATROL_EMAIL }}" \
              --dart-define=PATROL_PASSWORD="${{ secrets.PATROL_PASSWORD }}" \
              --verbose
          else
            echo "📝 Building all tests in integration_test/"
            # Build with a representative test file (Patrol requires a target)
            patrol build android \
              --target integration_test/cardCanBeFrozenOrUnfreeze_test.dart \
              --dart-define=PATROL_EMAIL="${{ secrets.PATROL_EMAIL }}" \
              --dart-define=PATROL_PASSWORD="${{ secrets.PATROL_PASSWORD }}" \
              --verbose
          fi
          
          echo "✅ APKs built successfully"
          ls -lh build/app/outputs/apk/debug/
          ls -lh build/app/outputs/apk/androidTest/debug/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Run tests on Firebase Test Lab
        run: |
          echo "🚀 Running tests on Firebase Test Lab"
          
          gcloud firebase test android run \
            --type instrumentation \
            --use-orchestrator \
            --app build/app/outputs/apk/debug/app-debug.apk \
            --test build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --timeout 10m \
            --results-bucket=gs://${{ secrets.FIREBASE_PROJECT_ID }}_test_results \
            --results-dir=patrol-android-$(date +%Y%m%d_%H%M%S) \
            --device model=Pixel2,version=31,locale=en,orientation=portrait \
            --device model=Pixel2,version=34,locale=en,orientation=portrait \
            --environment-variables clearPackageData=true \
            --no-record-video \
            --no-performance-metrics
          
          echo "✅ Tests completed on Firebase Test Lab"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-test-lab-android-results
          path: |
            build/app/outputs/apk/**/*.apk
          if-no-files-found: ignore
