

name: Patrol Android CI
on:
  push:
    branches:
      - main
      - test_playground
      - SOL-*
  pull_request:
    branches:
      - main
      - test_playground
      - SOL-*
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Test filter (e.g., my_test.dart or leave empty for all)'
        required: false
        default: ''
      max_retries:
        description: 'Number of retry attempts'
        required: false
        default: '1'

jobs:
  patrol-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Using latest stable to get Dart SDK 3.8.0+ required by patrol_finders

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      # Optional: Gradle cache to speed up build times
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Create main .env file (required for app config)
      - name: Create .env file
        run: |
          cat > .env << EOF
          COGNITO_USER_POOL_ID=${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          GEONAMES_USERNAME=${{ secrets.GEONAMES_USERNAME }}
          EOF
          echo "✅ Created .env with app configuration"

      - name: Build APKs with Patrol
        run: |
          flutter doctor -v
          echo "🔨 Building test APKs for Firebase Test Lab"
          
          # Build for each test file or all tests
            echo "📝 Building all tests in integration_test/"
            # Build with a representative test file (Patrol requires a target)
            patrol build android \
              --target integration_test/all_tests_test.dart \
              --dart-define=PATROL_EMAIL="${{ secrets.PATROL_EMAIL }}" \
              --dart-define=PATROL_PASSWORD="${{ secrets.PATROL_PASSWORD }}" \
              --verbose
          
          echo "✅ APKs built successfully"
          ls -lh build/app/outputs/apk/debug/
          ls -lh build/app/outputs/apk/androidTest/debug/
