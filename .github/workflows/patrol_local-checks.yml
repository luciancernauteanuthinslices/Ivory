name: Patrol local checks

on:
  workflow_dispatch:

jobs:
  integration_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin if you want; otherwise omit to use latest stable
          flutter-version: '3.35.5'
          architecture: x64 # Fix for running on Apple Silicon with act

      - name: flutter pub get
        run: flutter pub get

      - name: Create .env.patrol
        run: |
          printf "EMAIL=%s\nPASSWORD=%s\n" \
            "${{ secrets.PATROL_USERNAME }}" \
            "${{ secrets.PATROL_PASSWORD }}" > integration_test/.env.patrol

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Run Patrol tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            flutter pub global activate patrol_cli
            patrol test --verbose

      # Optional: surface useful logs/artifacts
      - name: Upload test outputs
        if: always() && github.actions # Only run on GitHub Actions, not locally with act
        uses: actions/upload-artifact@v4
        with:
          name: patrol-test-output
          path: |
            test_output/**
            build/patrol/**
          if-no-files-found: ignore
