  integration-test-android:
    name: Integration Tests (Android)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [29]   # API 29 is the most stable on GitHub Actions runners
        arch: [x86_64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.arch }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Create .env for app configuration
        run: |
          cat > .env << 'EOF'
          COGNITO_USER_POOL_ID=${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          GEONAMES_USERNAME=${{ secrets.GEONAMES_USERNAME }}
          EOF
          echo "Created .env"

      - name: Run integration tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            adb logcat > logcat.txt &
            flutter doctor -v
            adb devices -l
            patrol test \
              --verbose \
              --target integration_test/repaymentRateIsSaved_test.dart \
              --dart-define="PATROL_EMAIL=${{ secrets.PATROL_EMAIL }}" \
              --dart-define="PATROL_PASSWORD=${{ secrets.PATROL_PASSWORD }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-android-${{ matrix.api-level }}
          path: |
            logcat.txt
          retention-days: 14

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-screenshots-android-${{ matrix.api-level }}
          path: |
            integration_test/screenshots/
            screenshots/
          retention-days: 14

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [ analyze-and-test, build-android, integration-test-android ]
    if: always()

    steps:
      - name: Check job status
        run: |
          if [[ "${{ needs.analyze-and-test.result }}" != "success" ]]; then
            echo "Analyze and test job failed"; exit 1; fi
          if [[ "${{ needs.build-android.result }}" != "success" ]]; then
            echo "Android build job failed"; exit 1; fi
          if [[ "${{ needs.integration-test-android.result }}" != "success" ]]; then
            echo "Android integration tests failed"; exit 1; fi
          echo "All critical jobs passed successfully!"
